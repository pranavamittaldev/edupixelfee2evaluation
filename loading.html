<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2.7;url=index.html">
    <title>SchoolPad - Loading...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="loading-body">
    <div class="preloader-content">
        <div class="preloader-logo-wrapper">
            <div class="preloader-logo-glow"></div>
            <div class="preloader-logo-icon">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
        </div>

        <h1 class="preloader-title">SchoolPad</h1>
        <p class="preloader-subtitle">Student Profile Management System</p>

        <div class="progress-box">
            <div class="progress-info">
                <span class="loader-status"></span>
                <span class="loader-percent"></span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="loader-info-card">
            <div class="info-card-header">
                <span class="info-badge">💡 Did You Know?</span>
            </div>
            <p class="loader-tip"></p>
        </div>
    </div>
</body>
</html>
